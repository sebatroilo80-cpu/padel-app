<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar turno</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="cliente-body">

<div class="cliente-app">

    <div class="cliente-box cliente-form-box" id="formBox">

        <div style="display:flex; align-items:center; gap:12px; margin-bottom:15px;">
            <div style="background:#eaf6ee; padding:12px; border-radius:12px;">✅</div>
            <div>
                <h2 style="margin:0;">Completar reserva</h2>
                <p style="margin:0; color:#777;">Confirmá tu turno en segundos</p>
            </div>
        </div>

        <div class="cliente-resumen" id="resumenReserva"></div>

        <form action="/reservar" method="POST" id="formReserva">

            <input type="hidden" name="fecha" id="inputFecha">
            <input type="hidden" name="horario" id="inputHorario">
            <input type="hidden" name="cancha" id="inputCancha">
            <input type="hidden" name="duracion" id="inputDuracion">
            <input type="hidden" name="metodo_pago" id="inputMetodoPago">
            <input type="hidden" name="opcion_pago" id="inputOpcionPago">
            <input type="hidden" name="precio" id="inputPrecio">

            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <input type="text" name="nombre" placeholder="👤 Nombre" class="campo" style="flex:1;" required>
                <input type="text" name="telefono" placeholder="📱 Teléfono" class="campo" style="flex:1;" required>
            </div>

            <h3>💸 Cómo querés pagar</h3>

            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <button type="button" class="opcion-card-app" data-tipo="opcion" data-valor="Reserva">
                    📝 Reservar  
                    <small>Pagás 30%</small>
                </button>

                <button type="button" class="opcion-card-app" data-tipo="opcion" data-valor="Pagado">
                    ✅ Pago total  
                    <small>Pagás 100%</small>
                </button>
            </div>

            <h3>💳 Método de pago</h3>

            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <button type="button" class="opcion-card-app" data-tipo="metodo" data-valor="Transferencia">
                    🏦 Transferencia  
                    <small>Bancario</small>
                </button>

                <button type="button" class="opcion-card-app" data-tipo="metodo" data-valor="Mercado Pago">
                    💳 Mercado Pago  
                    <small>Digital</small>
                </button>
            </div>

            <div id="datos_transferencia" style="display:none; margin-top:12px;">
                <div style="background:#111; color:#fff; padding:15px; border-radius:10px;">
                    <strong>📌 Datos para transferir</strong><br><br>
                    Alias: 37padelclub<br>
                    CVU: 0000003100030540946290<br>
                    Titular: Eduardo Sebastián Troilo<br><br>
                    <small>⚠️ Queda pendiente hasta confirmar</small>
                </div>
            </div>

            <div style="margin:20px 0;">
                <p id="precioTotalTexto"></p>
                <p id="precioPagoTexto"></p>
            </div>

            <button class="boton" style="width:100%; font-size:18px;">
                🚀 Confirmar reserva
            </button>

        </form>
    </div>

</div>

<script>
const config = {{ config|tojson }};

let precioSeleccionado = 0;
let metodoPagoSeleccionado = "";
let opcionPagoSeleccionada = "";

const inputMetodoPago = document.getElementById("inputMetodoPago");
const inputOpcionPago = document.getElementById("inputOpcionPago");
const inputPrecio = document.getElementById("inputPrecio");

const precioTotalTexto = document.getElementById("precioTotalTexto");
const precioPagoTexto = document.getElementById("precioPagoTexto");

const datosTransferencia = document.getElementById("datos_transferencia");

function actualizarPago() {
    if (!precioSeleccionado) return;

    precioTotalTexto.textContent = "💰 Total: $" + precioSeleccionado;

    if (opcionPagoSeleccionada === "Reserva") {
        precioPagoTexto.textContent = "Pagás ahora: $" + (precioSeleccionado * 0.30);
    } else if (opcionPagoSeleccionada === "Pagado") {
        precioPagoTexto.textContent = "Pagás ahora: $" + precioSeleccionado;
    }
}

document.querySelectorAll(".opcion-card-app").forEach(btn => {
    btn.onclick = () => {
        const tipo = btn.dataset.tipo;
        const valor = btn.dataset.valor;

        document.querySelectorAll(`[data-tipo="${tipo}"]`).forEach(x => x.classList.remove("activa"));
        btn.classList.add("activa");

        if (tipo === "metodo") {
            metodoPagoSeleccionado = valor;
            inputMetodoPago.value = valor;

            if (valor === "Transferencia") {
                datosTransferencia.style.display = "block";
            } else {
                datosTransferencia.style.display = "none";
            }
        }

        if (tipo === "opcion") {
            opcionPagoSeleccionada = valor;
            inputOpcionPago.value = valor;
            actualizarPago();
        }
    };
});

document.getElementById("formReserva").addEventListener("submit", (e) => {
    if (!inputOpcionPago.value || !inputMetodoPago.value) {
        e.preventDefault();
        alert("Elegí cómo pagar y método");
    }
});
</script>

<style>
.opcion-card-app {
    flex:1;
    border:2px solid #ddd;
    border-radius:12px;
    padding:15px;
    text-align:center;
    cursor:pointer;
    font-weight:bold;
    background:#fff;
}

.opcion-card-app small {
    display:block;
    font-weight:normal;
    color:#777;
}

.opcion-card-app.activa {
    border-color:#4CAF50;
    background:#eaf6ee;
}
</style>

</body>
</html>

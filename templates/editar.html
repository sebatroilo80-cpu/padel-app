<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar reserva</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="contenedor" style="max-width: 650px;">

        <div class="topbar">
            <div class="topbar-left">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo-admin">
                <div>
                    <h1 class="titulo-admin" style="font-size:28px;">Editar reserva</h1>
                    <p class="sub-admin">37 Pádel Club</p>
                </div>
            </div>
        </div>

        <div class="bloque-seccion">
            <form method="POST">
                <input type="text" name="nombre" class="campo" value="{{ reserva[1] }}" required>

                <input type="text" class="campo" value="{{ reserva[2] or '' }}" readonly>

                <input type="date" name="fecha" class="campo" value="{{ reserva[3] }}" required>

                <select name="cancha" class="campo" required>
                    <option {% if reserva[4] == "Cancha 1" %}selected{% endif %}>Cancha 1</option>
                    <option {% if reserva[4] == "Cancha 2" %}selected{% endif %}>Cancha 2</option>
                    <option {% if reserva[4] == "Cancha 3" %}selected{% endif %}>Cancha 3</option>
                </select>

                <select name="duracion" class="campo" required>
                    <option {% if reserva[5] == "60 minutos" %}selected{% endif %}>60 minutos</option>
                    <option {% if reserva[5] == "90 minutos" %}selected{% endif %}>90 minutos</option>
                </select>

                <select name="horario" class="campo" required>
                    <option {% if reserva[6] == "08:00" %}selected{% endif %}>08:00</option>
                    <option {% if reserva[6] == "08:30" %}selected{% endif %}>08:30</option>
                    <option {% if reserva[6] == "09:00" %}selected{% endif %}>09:00</option>
                    <option {% if reserva[6] == "09:30" %}selected{% endif %}>09:30</option>
                    <option {% if reserva[6] == "10:00" %}selected{% endif %}>10:00</option>
                    <option {% if reserva[6] == "10:30" %}selected{% endif %}>10:30</option>
                    <option {% if reserva[6] == "11:00" %}selected{% endif %}>11:00</option>
                    <option {% if reserva[6] == "11:30" %}selected{% endif %}>11:30</option>
                    <option {% if reserva[6] == "12:00" %}selected{% endif %}>12:00</option>
                    <option {% if reserva[6] == "12:30" %}selected{% endif %}>12:30</option>
                    <option {% if reserva[6] == "13:00" %}selected{% endif %}>13:00</option>
                    <option {% if reserva[6] == "13:30" %}selected{% endif %}>13:30</option>
                    <option {% if reserva[6] == "14:00" %}selected{% endif %}>14:00</option>
                    <option {% if reserva[6] == "14:30" %}selected{% endif %}>14:30</option>
                    <option {% if reserva[6] == "15:00" %}selected{% endif %}>15:00</option>
                    <option {% if reserva[6] == "15:30" %}selected{% endif %}>15:30</option>
                    <option {% if reserva[6] == "16:00" %}selected{% endif %}>16:00</option>
                    <option {% if reserva[6] == "16:30" %}selected{% endif %}>16:30</option>
                    <option {% if reserva[6] == "17:00" %}selected{% endif %}>17:00</option>
                    <option {% if reserva[6] == "17:30" %}selected{% endif %}>17:30</option>
                    <option {% if reserva[6] == "18:00" %}selected{% endif %}>18:00</option>
                    <option {% if reserva[6] == "18:30" %}selected{% endif %}>18:30</option>
                    <option {% if reserva[6] == "19:00" %}selected{% endif %}>19:00</option>
                    <option {% if reserva[6] == "19:30" %}selected{% endif %}>19:30</option>
                    <option {% if reserva[6] == "20:00" %}selected{% endif %}>20:00</option>
                    <option {% if reserva[6] == "20:30" %}selected{% endif %}>20:30</option>
                    <option {% if reserva[6] == "21:00" %}selected{% endif %}>21:00</option>
                    <option {% if reserva[6] == "21:30" %}selected{% endif %}>21:30</option>
                    <option {% if reserva[6] == "22:00" %}selected{% endif %}>22:00</option>
                    <option {% if reserva[6] == "22:30" %}selected{% endif %}>22:30</option>
                    <option {% if reserva[6] == "23:00" %}selected{% endif %}>23:00</option>
                    <option {% if reserva[6] == "23:30" %}selected{% endif %}>23:30</option>
                </select>

                <select name="metodo_pago" class="campo" required>
                    <option {% if reserva[8] == "Efectivo" %}selected{% endif %}>Efectivo</option>
                    <option {% if reserva[8] == "Transferencia" %}selected{% endif %}>Transferencia</option>
                    <option {% if reserva[8] == "Mercado Pago" %}selected{% endif %}>Mercado Pago</option>
                    <option {% if reserva[8] == "QR" %}selected{% endif %}>QR</option>
                </select>

                <input type="number" step="0.01" name="pagado" class="campo" value="{{ reserva[10] }}" placeholder="Monto pagado">

                <div class="bloque-seccion" style="background:#f8fafc; margin-top:12px;">
                    <strong>Estado:</strong> {{ reserva[9] }}<br>
                    <strong>Precio total:</strong> ${{ reserva[7] }}<br>
                    <strong>Pagó:</strong> ${{ reserva[10] }}<br>
                    <strong>Falta:</strong> ${{ reserva[7] - reserva[10] }}
                </div>

                <button type="submit" class="boton" style="margin-top: 12px;">Guardar cambios</button>
            </form>

            <a href="/admin?fecha={{ reserva[3] }}" class="btn-top btn-azul" style="margin-top:12px;">
                Volver al panel
            </a>
        </div>
    </div>
</body>
</html>
